Global:
  config_role: V26_MASKED_SVTR_FT_W480
  model_name: PP-OCRv4_mobile_rec
  debug: false
  use_gpu: true
  epoch_num: 6
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: /kaggle/working/output/rec_cham_v26_masked_ft
  save_epoch_step: 1
  eval_batch_step:
  - 0
  - 9999999
  cal_metric_during_train: false
  pretrained_model: /kaggle/working/data/v26_base/best
  checkpoints: null
  save_inference_dir: /kaggle/working/output/rec_cham_v26_masked_ft_infer
  use_visualdl: false
  export_with_pir: false
  use_amp: true
  amp_level: O1
  infer_img: null
  character_dict_path: /kaggle/working/data/cham_dict_v24_1.txt
  max_text_length: 100
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: /kaggle/working/output/rec_cham_v26_masked_ft/predicts.txt
  d2s_train_image_shape:
  - 3
  - 48
  - 480
  freeze_prefixes:
  - backbone.conv1
  - backbone.blocks2
  - backbone.blocks3
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 1.5e-05
    eta_min: 2.0e-06
    warmup_epoch: 0.4
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  # V26: key-padding mask for the CTC SVTR neck's global attention (zero-padded columns are
  # excluded as attention keys). Implemented in ppocr/modeling/architectures/base_model.py,
  # heads/rec_multi_head.py, necks/rnn.py, backbones/rec_svtrnet.py. No new parameters.
  use_valid_mask: true
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    out_channels_list:
      CTCLabelDecode: 116
      NRTRLabelDecode: 119
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 100
Loss:
  name: BlankAwareMultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
  character_dict_path: /kaggle/working/data/cham_dict_v24_1.txt
  use_space_char: true
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/working/data/cham_synthetic_v26_ft
    label_file_list:
    - /kaggle/working/data/cham_synthetic_v26_ft/train_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug: null
    - BlankAwareMultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 480
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 4
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/working/data/cham_synthetic_v26_ft
    label_file_list:
    - /kaggle/working/data/cham_synthetic_v26_ft/val_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - BlankAwareMultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 480
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    batch_size_per_card: 32
    drop_last: false
    num_workers: 4
