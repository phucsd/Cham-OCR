Global:
  debug: false
  use_gpu: true
  epoch_num: &epoch_num 20
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: /kaggle/working/output/ch_PP-OCRv4_det_cham_v3
  save_epoch_step: 1
  eval_batch_step:
  - 0
  - 9999999
  cal_metric_during_train: false
  pretrained_model: /kaggle/working/data/cham_det_v3_base.pdparams
  checkpoints: null
  save_inference_dir: /kaggle/working/output/ch_PP-OCRv4_det_cham_v3_infer
  use_visualdl: false
  export_with_pir: false
  infer_img: null
  save_res_path: /kaggle/working/output/ch_PP-OCRv4_det_cham_v3/predicts_det.txt
  distributed: true

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.75
    det: True
  Neck:
    name: RSEFPN
    out_channels: 96
    shortcut: True
  Head:
    name: DBHead
    k: 50

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.00018
    eta_min: 5.0e-06
    warmup_epoch: 1.5
  regularizer:
    name: L2
    factor: 5.0e-05

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.4
  max_candidates: 1000
  unclip_ratio: 1.8

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/working/data/detector_v3_2_poly/
    label_file_list:
      - /kaggle/working/data/detector_v3_2_poly/det_train_label.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - IaaAugment:
        augmenter_args:
        - type: Affine
          args:
            rotate:
            - -7
            - 7
        - type: Resize
          args:
            size:
            - 0.6
            - 2.2
    - EastRandomCropData:
        size:
        - 640
        - 640
        max_tries: 50
        keep_ratio: true
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 6
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: true
    batch_size_per_card: 8
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/working/data/detector_v3_2_poly/
    label_file_list:
      - /kaggle/working/data/detector_v3_2_poly/det_val_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest:
        limit_side_len: 960
        limit_type: max
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 0
