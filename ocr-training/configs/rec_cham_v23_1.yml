Global:
  model_name: PP-OCRv4_mobile_rec
  debug: false
  use_gpu: false
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: e:/Phuc's Data/Github/Cham-OCR/data/output/rec_cham_v23_1
  save_epoch_step: 5
  eval_batch_step:
  - 0
  - 500
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: e:/Phuc's Data/Github/Cham-OCR/data/output_v23_1_temp/rec_cham_best_model/iter_epoch_200
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: e:/Phuc's Data/Github/Cham-OCR/data/cham_dict_v23_1.txt
  max_text_length: 80
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: e:/Phuc's Data/Github/Cham-OCR/data/output/rec_cham_v23_1
  d2s_train_image_shape:
  - 3
  - 48
  - 320
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0002
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 80
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: e:/Phuc's Data/Github/Cham-OCR/data/cham_synthetic_v23_1
    ext_op_transform_idx: 1
    label_file_list:
    - e:/Phuc's Data/Github/Cham-OCR/data/cham_synthetic_v23_1/train_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape:
        - 48
        - 320
        - 3
        max_text_length: 80
    - RecAug: null
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales:
    - - 320
      - 32
    - - 320
      - 48
    - - 320
      - 64
    first_bs: 24
    fix_bs: false
    divided_factor:
    - 8
    - 16
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: 24
    drop_last: true
    num_workers: 2
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: e:/Phuc's Data/Github/Cham-OCR/data/cham_synthetic_v23_1
    label_file_list:
    - e:/Phuc's Data/Github/Cham-OCR/data/cham_synthetic_v23_1/val_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 24
    num_workers: 2
