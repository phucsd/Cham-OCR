Global:
  model_name: PP-OCRv4_mobile_rec_v25
  debug: false
  use_gpu: true
  epoch_num: 40                      # Tổng 40 epochs toàn cầu (T_max = 40 * 2187 = 87480 steps), bảo toàn đường cong Cosine
  stage_end_epoch: 12                # Ngắt chặng 1 tại epoch 12, chặng 2 tại 22, chặng 3 tại 40 (decoupled controller)
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: /kaggle/working/output/rec_cham_v25
  save_epoch_step: 1                 # Bắt buộc lưu sau mỗi epoch để luôn có full checkpoint (pdparams + pdopt + states)
  eval_batch_step:
  - 0
  - 500
  cal_metric_during_train: false
  pretrained_model: null             # TUYỆT ĐỐI KHÔNG dùng để resume giữa các chặng (sẽ làm mất optimizer state)
  checkpoints: null                  # Cấu hình resume chặng 2/3: trỏ vào đường dẫn '.../latest' của chặng trước
  save_inference_dir: /kaggle/working/output/rec_cham_v25_infer
  use_visualdl: false
  infer_img: null
  character_dict_path: /kaggle/working/data/cham_dict_v25.txt
  max_text_length: 80                # Bao trùm 99.9% độ dài nhãn (P99 scan), tránh cắt cụt dòng song ngữ
  infer_mode: false
  use_space_char: true
  distributed: true                  # Chạy phân tán song song đa GPU trên T4x2
  save_res_path: /kaggle/working/output/rec_cham_v25/predicts.txt
  use_amp: true                      # Kích hoạt 640 nhân Turing Tensor Cores
  amp_level: 'O1'
  d2s_train_image_shape:
  - 3
  - 48
  - 480                              # Chiều rộng 480px chống co bẹp nét chữ song ngữ và bảo tồn nét ꨲ/ꨶ, ꩝/꩝꩝

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 80
        num_heads: 6
        num_encoder_layers: 3
        num_decoder_layers: 3

Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/working/data/cham_synthetic_v25
    label_file_list:
    - /kaggle/working/data/cham_synthetic_v25/train_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug: null                   # On-the-fly Augmentation (motion blur, defocus, noise) trong RAM, chống double-blur
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 480                        # Chuẩn hóa kích thước 48x480 bảo toàn vi mô glyph
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
  loader:
    shuffle: true
    batch_size_per_card: 32          # 32/card x 2 GPUs = Global BS 64 (tối ưu tuyệt đối cho 48x480 & max_len 80, ~7.8GB VRAM)
    drop_last: true
    num_workers: 2                   # Khớp hoàn hảo 4 vCPU của Kaggle (2 workers x 2 cards)

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/working/data/cham_synthetic_v25
    label_file_list:
    - /kaggle/working/data/cham_synthetic_v25/val_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 480
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32          # Giảm xuống 32 để tránh OOM trong lúc đánh giá
    num_workers: 2
